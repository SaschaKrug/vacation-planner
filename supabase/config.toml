# Minimal Supabase CLI config. Only used for `supabase db push` and
# `supabase functions deploy` from GitHub Actions.
project_id = "vacation-planner"

[functions.api]
# The calendar feed and the API are protected by unguessable session ids,
# so the function must be reachable without a Supabase JWT (iCloud can't send one).
verify_jwt = false
