# Minimal Supabase CLI config. Only used for `supabase db push` and
# `supabase functions deploy` from GitHub Actions.
project_id = "family-planner"

[functions.api]
# The API checks its own tokens (sign-in sessions and API tokens), and the calendar
# feed has an unguessable id, so the function must be reachable without a Supabase
# JWT (iCloud can't send one).
verify_jwt = false
