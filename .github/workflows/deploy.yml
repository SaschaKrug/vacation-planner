name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Type-check and build the app
        working-directory: app
        run: npm ci && npm run build

  backend:
    name: Supabase (database + API function)
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      AI_CONFIG_KEY: ${{ secrets.AI_CONFIG_KEY }}
      INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
      # Where the app runs (the custom domain below): only it may use passkeys.
      APP_ORIGIN: https://family-planner.fa-krug.de
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Supabase secrets are missing - skipping the backend deploy (see README)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.secrets.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        if: steps.secrets.outputs.ok == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Set the AI key secret
        if: steps.secrets.outputs.ok == 'true' && env.AI_CONFIG_KEY != ''
        run: supabase secrets set AI_CONFIG_KEY="$AI_CONFIG_KEY" --project-ref "$PROJECT_REF"
      - name: Set the app origin (for passkeys)
        if: steps.secrets.outputs.ok == 'true'
        run: supabase secrets set APP_ORIGIN="$APP_ORIGIN" --project-ref "$PROJECT_REF"
      - name: Set the initial admin password
        if: steps.secrets.outputs.ok == 'true' && env.INITIAL_ADMIN_PASSWORD != ''
        run: |
          supabase secrets set INITIAL_ADMIN_PASSWORD="$INITIAL_ADMIN_PASSWORD" \
            --project-ref "$PROJECT_REF"
      - name: Deploy the "api" Edge Function
        if: steps.secrets.outputs.ok == 'true'
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

  pages:
    name: GitHub Pages (frontend)
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the app
        working-directory: app
        run: npm ci && npm run build
      - name: Point the frontend at the Supabase function
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$PROJECT_REF" ]; then
            api="https://${PROJECT_REF}.supabase.co/functions/v1/api"
          else
            api=""
          fi
          echo "window.FP_CONFIG = { apiBase: \"${api}\" };" > app/dist/config.js
      - name: Publish app/dist to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/dist
          force_orphan: true
          # Keeps the custom domain (force_orphan would otherwise drop the CNAME file).
          cname: family-planner.fa-krug.de
          commit_message: "Deploy ${{ github.sha }}"
