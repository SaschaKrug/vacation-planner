name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check, lint, format
        run: deno task check
      - name: Unit + API tests
        run: deno task test
